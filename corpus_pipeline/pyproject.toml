[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazlegal-corpus"
version = "0.1.0"
description = "Provenance-first, non-synthetic Kazakh legislation corpus pipeline"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4==4.14.3"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
hub = ["huggingface-hub==1.16.1"]
parquet = ["pyarrow>=17,<25"]

[project.scripts]
kazlegal-corpus = "kazlegal_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
