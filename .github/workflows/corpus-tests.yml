name: Legal corpus and experiment integration

on: [push, pull_request]

jobs:
  corpus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: corpus_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
      - run: python -m kazlegal_corpus --help

  integration:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python scripts/run_smoke_tests.py
